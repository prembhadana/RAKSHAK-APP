name: Build Rakshak APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Parent APK
        run: gradle assembleParentDebug --stacktrace

      - name: Upload Parent APK
        uses: actions/upload-artifact@v4
        with:
          name: rakshak-parent-debug-apk
          path: app/build/outputs/apk/parent/debug/*.apk
          if-no-files-found: error
